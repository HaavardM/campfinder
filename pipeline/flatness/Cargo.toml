[package]
name = "flatness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
indicatif = "0.18.6"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
terrio = { version = "=0.7.0", default-features = false, features = ["sqlite"] } # GeoPackage + rasterize, pure Rust
tiff = "0.11"
toml = "~1.1.8"
ureq = "~3.4.2"

[profile.release]
debug = "line-tables-only" # readable profiles (flamegraph) at no runtime cost
