# Tents to compute flatness for. Sizes are the tent's own footprint in
# metres; the pipeline adds `clearance_m` on every side for guy lines and
# pegs, so the flat area checked is a bit larger than the tent itself.
#
# Changing a tent (or adding one) only reprocesses that tent.

clearance_m = 0.5

[[tent]]
name = "Gamme 8 PC"
shape = "round"
diameter_m = 4.32

[[tent]]
name = "Keron 4 GT"
shape = "rectangle"
width_m = 2.1
length_m = 5.0
