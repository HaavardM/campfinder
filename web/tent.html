<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- Fill the screen beside an iPhone's camera cutout too, rather than
		leave white bars there in landscape. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Gamme 8 PC</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- iPhones can't go full screen; from the Home Screen the page opens
		without browser bars. -->
		<link rel="manifest" href="/tent.webmanifest" />
		<style>
			/* Shown at once, before any script, and faded out by scene.ts once
			the shaders are compiled. Styled here rather than in styles.css,
			which only arrives with the script. */
			#loading {
				position: fixed;
				inset: 0;
				z-index: 50;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				background: #0f1012;
				color: #c9ccd1;
				font: 500 15px system-ui, sans-serif;
				transition: opacity 0.4s;
			}
			#loading svg {
				width: 44px;
				height: 44px;
				animation: breathe 1.6s ease-in-out infinite;
			}
			@keyframes breathe {
				50% {
					opacity: 0.45;
				}
			}
		</style>
	</head>
	<body>
		<div id="loading">
			<svg viewBox="0 0 24 24" fill="none" stroke="#e8a24a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 21 14 3"/><path d="M20.5 21 10 3"/><path d="M15.5 21 12 15l-3.5 6"/><path d="M2 21h20"/></svg>
			Pitching the tent…
		</div>
		<canvas id="scene"></canvas>
		<div id="root"></div>
		<script type="module" src="/src/tent/main.tsx"></script>
	</body>
</html>
